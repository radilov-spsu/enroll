name: Создание репозитория студента

# pull_request_target — чтобы был доступ к секрету с админ-токеном.
# ВАЖНО: здесь НЕЛЬЗЯ делать checkout ветки студента и запускать из неё код.
# Мы забираем уже смерженную базовую ветку — это доверенное содержимое.
on:
  pull_request_target:
    types: [closed]

concurrency:
  group: enroll-registry
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-repo:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Забрать базовую ветку (уже с файлом студента)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyyaml

      - name: Разобрать заявку
        id: student
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          COURSE_YEAR: ${{ vars.COURSE_YEAR }}
        run: |
          set -euo pipefail
          FILE="students/${AUTHOR}.yml"
          if [ ! -f "$FILE" ]; then
            echo "::error::После мержа файл $FILE не найден — заявка не соответствует правилам."
            exit 1
          fi
          python scripts/translit.py "$FILE" | tee -a "$GITHUB_OUTPUT"

      - name: Создать репозиторий из шаблона
        id: create
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
          TEMPLATE: ${{ vars.TEMPLATE_REPO }}
          REPO: ${{ steps.student.outputs.repo_name }}
          FIO: ${{ steps.student.outputs.fio }}
          GROUP: ${{ steps.student.outputs.group }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if gh repo view "$ORG/$REPO" >/dev/null 2>&1; then
            echo "Репозиторий $ORG/$REPO уже существует — пропускаю создание."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh api "repos/$ORG/$TEMPLATE/generate" \
              -f owner="$ORG" \
              -f name="$REPO" \
              -f description="$FIO, группа $GROUP (@$AUTHOR)" \
              -F private=true \
              -F include_all_branches=false
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "url=https://github.com/$ORG/$REPO" >> "$GITHUB_OUTPUT"

      - name: Выдать студенту доступ на запись
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
          REPO: ${{ steps.student.outputs.repo_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # push, а не admin: студент не сможет удалить репозиторий,
          # сделать его публичным или снять защиту веток.
          gh api -X PUT "repos/$ORG/$REPO/collaborators/$AUTHOR" -f permission=push

      - name: Настроить репозиторий
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
          REPO: ${{ steps.student.outputs.repo_name }}
          GROUP: ${{ steps.student.outputs.group }}
          YEAR: ${{ steps.student.outputs.year }}
        run: |
          set -euo pipefail
          # Отключаем всё лишнее, оставляем issues (для сдачи работ) и PR.
          gh api -X PATCH "repos/$ORG/$REPO" \
            -F has_wiki=false -F has_projects=false \
            -F allow_squash_merge=true -F allow_merge_commit=false \
            -F allow_rebase_merge=false -F delete_branch_on_merge=true

          GROUP_TOPIC=$(printf '%s' "$GROUP" | tr 'A-Z' 'a-z' | tr -cs 'a-z0-9' '-' | sed 's/^-//;s/-$//')
          gh api -X PUT "repos/$ORG/$REPO/topics" \
            -f "names[]=student-work" -f "names[]=year-$YEAR" \
            ${GROUP_TOPIC:+-f "names[]=group-$GROUP_TOPIC"}

      - name: Защитить ветку main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
          REPO: ${{ steps.student.outputs.repo_name }}
        run: |
          set -euo pipefail
          # На бесплатном тарифе защита веток в приватных репозиториях недоступна —
          # шаг помечен continue-on-error и просто пропустится.
          gh api -X POST "repos/$ORG/$REPO/rulesets" --input - <<'JSON'
          {
            "name": "protect-main",
            "target": "branch",
            "enforcement": "active",
            "conditions": {"ref_name": {"include": ["~DEFAULT_BRANCH"], "exclude": []}},
            "bypass_actors": [{"actor_id": 5, "actor_type": "RepositoryRole", "bypass_mode": "always"}],
            "rules": [
              {"type": "deletion"},
              {"type": "non_fast_forward"},
              {"type": "pull_request", "parameters": {
                "required_approving_review_count": 1,
                "dismiss_stale_reviews_on_push": false,
                "require_code_owner_review": true,
                "require_last_push_approval": false,
                "required_review_thread_resolution": false,
                "allowed_merge_methods": ["squash"]
              }}
            ]
          }
          JSON

      - name: Записать студента в реестр
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          FIO: ${{ steps.student.outputs.fio }}
          GROUP: ${{ steps.student.outputs.group }}
          YEAR: ${{ steps.student.outputs.year }}
          REPO: ${{ steps.student.outputs.repo_name }}
          URL: ${{ steps.create.outputs.url }}
        run: |
          set -euo pipefail
          LINE="| $YEAR | $GROUP | $FIO | @$AUTHOR | [\`$REPO\`]($URL) |"
          if grep -Fq "$LINE" REGISTRY.md; then
            echo "Строка уже есть в реестре."
            exit 0
          fi
          printf '%s\n' "$LINE" >> REGISTRY.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REGISTRY.md
          git commit -m "registry: $FIO ($YEAR)"
          for i in 1 2 3; do
            git push && break
            git pull --rebase && sleep 3
          done

      - name: Ответить студенту в PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO_FULL: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          URL: ${{ steps.create.outputs.url }}
          NAME: ${{ steps.student.outputs.repo_name }}
        run: |
          gh pr comment "$PR" --repo "$REPO_FULL" --body "$(cat <<EOF
          @$AUTHOR, заявка принята ✅

          Ваш личный репозиторий: **[$NAME]($URL)**

          Что делать дальше:
          1. На почту, привязанную к GitHub, придёт приглашение — примите его
             (или откройте ссылку выше и нажмите **Accept invitation**).
          2. Склонируйте репозиторий: \`git clone $URL.git\`
          3. Прочитайте \`README.md\` внутри — там правила сдачи работ.

          Репозиторий приватный: он виден только вам и преподавателю.
          EOF
          )"

      - name: Сообщить об ошибке
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO_FULL: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$REPO_FULL" \
            --body "@$AUTHOR, при создании репозитория произошла ошибка. Преподаватель разберётся вручную. Лог: $RUN"
