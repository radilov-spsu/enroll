name: Проверка заявки

# Обычный pull_request: код и данные из форка НЕ доверенные,
# поэтому здесь нет доступа к секретам — только проверки.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать базовую ветку (доверенный код скриптов)
        uses: actions/checkout@v4

      - name: Сохранить скрипты отдельно
        run: cp -r scripts "$RUNNER_TEMP/scripts"

      - name: Забрать содержимое PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyyaml

      - name: Проверить состав изменений
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(gh api --paginate \
            "repos/$REPO/pulls/$PR/files" --jq '.[].filename')

          echo "Изменённые файлы: ${FILES[*]}"

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "::error::PR должен добавлять ровно один файл — students/$AUTHOR.yml. Сейчас изменено ${#FILES[@]} файлов."
            exit 1
          fi

          EXPECTED="students/${AUTHOR}.yml"
          if [ "${FILES[0]}" != "$EXPECTED" ]; then
            echo "::error::Файл должен называться $EXPECTED (ваш GitHub-логин), а не ${FILES[0]}."
            exit 1
          fi

          echo "OK: $EXPECTED"

      - name: Проверить содержимое заявки
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          COURSE_YEAR: ${{ vars.COURSE_YEAR }}
        run: |
          set -euo pipefail
          OUT=$(python "$RUNNER_TEMP/scripts/translit.py" "pr/students/${AUTHOR}.yml")
          echo "$OUT"
          NAME=$(printf '%s\n' "$OUT" | sed -n 's/^repo_name=//p')
          FIO=$(printf '%s\n' "$OUT" | sed -n 's/^fio=//p')
          {
            echo "### Заявка корректна ✅"
            echo
            echo "| Поле | Значение |"
            echo "|---|---|"
            echo "| ФИО | $FIO |"
            echo "| Репозиторий будет создан как | \`$NAME\` |"
            echo
            echo "Ожидайте, пока преподаватель примет заявку."
          } >> "$GITHUB_STEP_SUMMARY"
