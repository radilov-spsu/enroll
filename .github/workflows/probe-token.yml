name: Проба прав токена (временный)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Может ли ORG_ADMIN_TOKEN заводить issue в репозитории студента
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          TARGET: radilov-spsu/stratu-nina-ft23dr62pf
        run: |
          set -uo pipefail
          echo "── чтение issues:"
          gh api "repos/$TARGET/issues" --jq 'length' && echo "   чтение: ок" || echo "   чтение: ОТКАЗ"
          echo "── создание issue:"
          if URL=$(gh issue create --repo "$TARGET" --title "проба прав, удалить" \
                     --body "Временный issue для проверки прав токена." 2>&1); then
            echo "   создание: ОК → $URL"
            NUM="${URL##*/}"
            gh issue close "$NUM" --repo "$TARGET" >/dev/null 2>&1 && echo "   закрытие: ок"
            ID=$(gh api graphql -f query="{repository(owner:\"radilov-spsu\",name:\"stratu-nina-ft23dr62pf\"){issue(number:$NUM){id}}}" --jq '.data.repository.issue.id' 2>/dev/null)
            if [ -n "${ID:-}" ]; then
              gh api graphql -f query="mutation{deleteIssue(input:{issueId:\"$ID\"}){clientMutationId}}" >/dev/null 2>&1 \
                && echo "   удаление: ок" || echo "   удаление: не вышло, удалите issue #$NUM вручную"
            fi
          else
            echo "   создание: ОТКАЗ → $URL"
          fi
