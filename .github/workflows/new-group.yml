name: Новая учебная группа

# Каждое лето в списке групп появляется набор нового года.
# Формат имени задан в scripts/add_group.py; если он изменится — править там.
on:
  schedule:
    - cron: '0 4 1 8 *'   # 1 августа
  workflow_dispatch:
    inputs:
      year:
        description: 'Год набора (по умолчанию текущий)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Добавить группу в форму заявки
        id: add
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ inputs.year }}" ]; then
            ARGS="--year ${{ inputs.year }}"
          fi
          python3 scripts/add_group.py $ARGS | tee "$RUNNER_TEMP/out.txt"
          grep -E '^(changed|group)=' "$RUNNER_TEMP/out.txt" >> "$GITHUB_OUTPUT" || true

      - name: Закоммитить
        if: steps.add.outputs.changed == 'true'
        env:
          GROUP: ${{ steps.add.outputs.group }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/enrollment.yml
          git commit -m "Группа нового набора: $GROUP"
          git push

      - name: Завести команду группы
        if: steps.add.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
          GROUP: ${{ steps.add.outputs.group }}
        run: |
          set -euo pipefail
          # Команда создаётся и при первой заявке от группы, но заводим её
          # заранее: так группа видна в организации ещё до регистраций.
          TEAM=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from translit import translit; print(translit('$GROUP'))")
          if gh api "orgs/$ORG/teams/$TEAM" >/dev/null 2>&1; then
            echo "Команда $TEAM уже существует."
          else
            gh api -X POST "orgs/$ORG/teams" \
              -f name="$TEAM" \
              -f description="Группа $GROUP, набор ${GROUP//[^0-9]/}" \
              -f privacy=secret \
              --jq '"создана команда \(.slug)"'
          fi

      - name: Отчёт
        env:
          CHANGED: ${{ steps.add.outputs.changed }}
          GROUP: ${{ steps.add.outputs.group }}
          DROPPED: ${{ steps.add.outputs.dropped }}
        run: |
          if [ "$CHANGED" != "true" ]; then
            echo "Группа текущего набора уже есть в списке." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Добавлена группа \`$GROUP\`"
            echo
            echo "Она доступна в форме заявки, команда организации заведена."
            if [ -n "$DROPPED" ]; then
              echo
              echo "Убраны из списка как выпустившиеся: \`$DROPPED\`."
              echo
              echo "Команды и репозитории этих групп не тронуты — работы остаются"
              echo "на месте, из формы убран только выбор."
            fi
          } >> "$GITHUB_STEP_SUMMARY" 
