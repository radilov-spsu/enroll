name: Заявка на курс
description: Получить личный репозиторий для сдачи работ
title: "Заявка на курс"
labels: ["заявка"]
# Преподаватель назначается исполнителем: уведомление о назначении приходит
# всегда, независимо от того, как настроена подписка на репозиторий.
assignees:
  - Nemo-Illusionist
body:
  - type: markdown
    attributes:
      value: |
        Заполните три поля — после проверки преподавателем вам автоматически
        создадут **личный приватный репозиторий**, доступный только вам и
        преподавателю. Ссылка придёт комментарием сюда же.

        Фамилию и имя пишите **как в зачётке**. Транслитерацию для имени
        репозитория робот сделает сам. Заголовок заявки менять не нужно —
        робот подставит туда ваши данные.

  - type: input
    id: last_name
    attributes:
      label: Фамилия
      placeholder: Иванов
    validations:
      required: true

  - type: input
    id: first_name
    attributes:
      label: Имя
      placeholder: Иван
    validations:
      required: true

  # Список групп пополняется автоматически каждое лето
  # (.github/workflows/new-group.yml). Порядок: новые наборы сверху.
  - type: dropdown
    id: group
    attributes:
      label: Группа
      description: Выберите свою группу. Нет в списке — напишите преподавателю.
      options:
        - ФТ26ДР62ПФ
        - ФТ25ДР62ПФ
        - ФТ24ДР62ПФ
        - ФТ23ДР62ПФ
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        После отправки робот в течение минуты ответит комментарием, всё ли
        в порядке с заявкой. Если он найдёт ошибку — нажмите **⋯ → Edit**
        в правом верхнем углу заявки и поправьте, проверка запустится заново.
